<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Smart Learning Platform</title>
<style>
:root{--b:#4285F4;--r:#EA4335;--y:#FBBC05;--g:#34A853;--ink:#172b43;--mut:#53657a;--card:#fff;--bg1:#e9f1ff;--bg2:#fff0ee;--bg3:#eaf6ed;--line:#dce5ef;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#e8eefb;--mut:#a9b7cc;--card:#18213a;--bg1:#0f1730;--bg2:#1a1430;--bg3:#0f2420;--line:#2a3658}}
:root[data-theme="dark"]{--ink:#e8eefb;--mut:#a9b7cc;--card:#18213a;--bg1:#0f1730;--bg2:#1a1430;--bg3:#0f2420;--line:#2a3658}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;font:16px/1.6 system-ui,"Segoe UI",Arial,sans-serif;color:var(--ink);background:var(--bg1);min-height:100vh}body:before{content:"";position:fixed;inset:-60px;z-index:-1;filter:blur(55px);opacity:.5;background:radial-gradient(circle at 12% 18%,var(--b),transparent 42%),radial-gradient(circle at 88% 12%,var(--r),transparent 42%),radial-gradient(circle at 15% 92%,var(--y),transparent 42%),radial-gradient(circle at 90% 88%,var(--g),transparent 42%)}
main{max-width:980px;margin:auto;padding:18px}
.hero{border-radius:24px;padding:40px 28px;color:#fff;background:linear-gradient(120deg,var(--b),#1a2a6c 70%);position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;right:-60px;top:-60px;width:240px;height:240px;border-radius:50%;background:var(--y);opacity:.35}
.hero h1{margin:0;font-size:clamp(2rem,6vw,3.2rem);position:relative}.hero p{position:relative;margin:.4em 0 0}
button,.btn{background:var(--b);color:#fff;border:0;border-radius:10px;padding:9px 16px;font:inherit;cursor:pointer;text-decoration:none;display:inline-block;margin:4px 6px 4px 0}
button.alt,.btn.alt{background:transparent;color:var(--b);border:1px solid var(--b)}
input[type=text]{padding:10px;border-radius:10px;border:1px solid var(--line);font:inherit;background:var(--card);color:var(--ink)}
.box{background:var(--card);border-radius:16px;padding:18px;margin:16px 0;border:1px solid var(--line)}
.advisor{border-left:8px solid var(--y)}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.course{background:var(--card);border-radius:16px;overflow:hidden;border:1px solid var(--line);cursor:pointer}
.course .pic{height:96px;display:flex;flex-wrap:wrap;align-content:flex-end;gap:0 .3em;align-items:flex-end;padding:10px 14px;color:#fff;font-weight:700;font-size:1.05rem}
.course .in{padding:12px 14px}.bar{height:8px;background:var(--line);border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--g)}
.badge{display:inline-block;background:var(--y);color:#172b43;border-radius:20px;padding:3px 12px;margin:4px 6px 0 0;font-weight:600}
.lock{opacity:.5}.ok{color:var(--g)}.no{color:var(--r)}small{color:var(--mut)}
.scanner{position:relative;overflow:hidden;border-radius:18px;padding:26px;color:#fff;text-align:center}
.scanner:before{content:"";position:absolute;inset:-40px;filter:blur(30px);background:radial-gradient(circle at 20% 30%,var(--b),transparent 45%),radial-gradient(circle at 80% 25%,var(--r),transparent 45%),radial-gradient(circle at 30% 85%,var(--y),transparent 45%),radial-gradient(circle at 80% 80%,var(--g),transparent 45%)}
.scanner>*{position:relative}.scanner img{max-width:100%;border-radius:10px;margin-top:10px}
.cert{text-align:center;border:10px double var(--b);border-radius:12px;padding:40px 20px;background:var(--card)}
label{display:block;margin:4px 0}
.c{display:inline-block;transition:transform .18s cubic-bezier(.2,2,.4,1),text-shadow .3s,color .3s}.c.hot{transform:translateY(-7px) scale(1.3) rotate(var(--r,0deg));color:var(--hc);text-shadow:0 6px 14px var(--hc),0 0 18px var(--hc)}
.prof{display:flex;gap:16px;align-items:center}.prof img{width:96px;height:96px;border-radius:50%;object-fit:cover;border:4px solid #fff;flex:none}
.pic3{margin:0;background:var(--card);border-radius:16px;overflow:hidden;border:1px solid var(--line);transition:transform .25s}.pic3:hover{transform:translateY(-6px)}.pic3 img{width:100%;height:250px;object-fit:cover;display:block}.pic3 figcaption{padding:10px 14px}
.glass{background:color-mix(in srgb,var(--card) 62%,transparent);backdrop-filter:blur(14px);border:1px solid #ffffff66;border-radius:20px;padding:16px;margin:14px 0}.res{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}.glass img{width:100%;border-radius:10px}.big{font-size:1.3rem}
.cam{width:100%;position:relative;border-radius:16px;overflow:hidden;background:#0b1020;aspect-ratio:4/3;max-height:400px;margin:0 auto}.cam video{width:100%;height:100%;object-fit:cover}.frame i{position:absolute;width:34px;height:34px;border:4px solid}.frame i:nth-child(1){top:12px;left:12px;border-color:var(--b) transparent transparent var(--b)}.frame i:nth-child(2){top:12px;right:12px;border-color:var(--r) var(--r) transparent transparent}.frame i:nth-child(3){bottom:12px;left:12px;border-color:transparent transparent var(--g) var(--g)}.frame i:nth-child(4){bottom:12px;right:12px;border-color:transparent var(--y) var(--y) transparent}
.frame u{position:absolute;left:8%;right:8%;height:3px;background:#fff;box-shadow:0 0 14px 4px var(--b);animation:sl 2.4s ease-in-out infinite alternate}@keyframes sl{from{top:8%}to{top:92%}}@media(prefers-reduced-motion:reduce){.frame u{animation:none;top:50%}.c{transition:none}}
input[type=password]{padding:10px;border-radius:10px;border:1px solid var(--line);font:inherit;background:var(--card);color:var(--ink)}
.bar2{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.gpage{border-radius:22px;padding:24px 26px;text-align:center;color:#fff;background:linear-gradient(110deg,var(--b),var(--r) 35%,var(--y) 65%,var(--g))}.gpage h2{margin:0;font-size:clamp(1.8rem,5vw,2.8rem);text-shadow:0 2px 14px #0007}.gpage p{margin:.3em 0 0;text-shadow:0 1px 8px #0007}
.grid2{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));margin-top:16px}.grid2 .pic3 img{height:360px}
.pager{display:flex;justify-content:center;align-items:center;gap:10px;margin:16px 0;flex-wrap:wrap}.dotb{width:14px;height:14px;padding:0;border-radius:50%;background:var(--line);margin:0}.dotb.on{background:var(--b);transform:scale(1.3)}button:disabled{opacity:.4;cursor:default}
#aiBtn{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;box-shadow:0 8px 24px #0004;border-radius:30px}
#aiPanel{position:fixed;right:16px;bottom:calc(70px + env(safe-area-inset-bottom,0px));width:min(380px,calc(100vw - 32px));height:min(460px,60vh);display:flex;flex-direction:column;z-index:20;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;box-shadow:0 16px 48px #0005}#aiPanel[hidden]{display:none}
#aiLog{flex:1;overflow:auto}.m{padding:8px 12px;border-radius:12px;margin:4px 0;white-space:pre-wrap}.m.u{background:var(--b);color:#fff;margin-left:34px}.m.a{background:var(--bg1);margin-right:34px}.aiin{display:flex;gap:6px;margin-top:8px}.aiin input{flex:1;min-width:0}
#pledge{position:fixed;inset:0;z-index:30;background:#000a;display:flex;align-items:center;justify-content:center;padding:16px}#pledge[hidden]{display:none}.pl{background:var(--card);max-width:560px;border-radius:22px;overflow:hidden}.pl:before{content:"";display:block;height:12px;background:linear-gradient(90deg,var(--b) 25%,var(--r) 25% 50%,var(--y) 50% 75%,var(--g) 75%)}.pi{padding:22px}
:focus-visible{outline:3px solid var(--y);outline-offset:2px}
pre{background:#0f172a;color:#e8eefb;padding:12px;border-radius:10px;overflow-x:auto;font-size:14px}h1,h2,h3{text-shadow:0 1px 10px var(--bg1)}

.guides{margin:22px 0}.guides>h3{margin:0 0 4px}.guides>p{margin:0 0 12px;color:var(--mut)}
.gd{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.gd figure{margin:0;background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;transition:transform .25s,box-shadow .25s}
.gd figure:hover{transform:translateY(-6px);box-shadow:0 14px 30px #0003}
.gd .im{position:relative;height:250px;background:#111}.gd img{width:100%;height:100%;object-fit:cover;display:block}
.gd .tag{position:absolute;top:10px;right:10px;left:auto;background:var(--y);color:#172b43;font-weight:700;border-radius:20px;padding:3px 12px;font-size:.85rem}
.gd figcaption{padding:12px 14px}.gd .ar{font-size:1.05rem;font-weight:600;line-height:1.7;margin:0 0 6px}.gd .en{font-size:.88rem;color:var(--mut);margin:0}
.gd figure:nth-child(1){border-top:5px solid var(--b)}.gd figure:nth-child(2){border-top:5px solid var(--r)}.gd figure:nth-child(3){border-top:5px solid var(--y)}.gd figure:nth-child(4){border-top:5px solid var(--g)}.gd figure:nth-child(5){border-top:5px solid var(--b)}
</style></head><body><main id="app"></main>
<div id="pledge" hidden></div><button id="aiBtn" hidden onclick="aiToggle()">&#10024; Assistant</button>
<div id="aiPanel" hidden><div id="aiLog"></div><div class="aiin"><input type="text" id="aiIn" placeholder="Ask or type a command..." onkeydown="if(event.key=='Enter')aiSend()"><button onclick="aiSend()">Send</button></div></div>

${c.L.map((l,i)=>{const open=i==0||S.lessons[key(c,i-1)],p=S.lessons[key(c,i)];
 return open?`<div class="box"><h3>${l[0]} ${p?"&#9989;":""}</h3><p>${l[1]}</p><p><b>${l[2]}</b></p>
 ${[l[3],l[4]].map((a,j)=>`<button class="alt" onclick="ans(${k},${i},${j})">${a}</button>`).join("")}<p id="m${i}"></p></div>`
 :`<div class="box lock"><h3>&#128274; ${l[0]}</h3><p>Pass the previous quiz to unlock this lesson.</p></div>`}).join("")}`}
function exam(k){const c=C[k];return `<p><button class="alt" onclick="go('course',${k})">&larr; ${c.t}</button></p><h2>${c.t}: final exam</h2>
${c.E.map((q,i)=>`<div class="box"><b>${q[0]}</b>${q[1].map((o,j)=>`<label><input type="radio" name="q${i}" value="${j}"> ${o}</label>`).join("")}<small id="e${i}"></small></div>`).join("")}
<button onclick="grade(${k})">Submit answers</button><div id="res" class="box" hidden></div>`}
function cert(k){const c=C[k];return `<p><button class="alt" onclick="go('course',${k})">&larr; Back</button> <button onclick="window.print()">Print</button></p>
<div class="cert"><h1>Certificate of Completion</h1><p>This certifies that</p><h2 style="color:var(--r)">${S.name||"Learner"}</h2><p>has completed</p><h2>${c.t}</h2><p class="ok">Smart Learning Platform · 100% Free</p></div>`}
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const wkDone=()=>F.M.filter((_,i)=>S.wk[i]).length,due=i=>S.pl.start+(i+1)*S.pl.pace*864e5,dd=i=>new Date(due(i)).toLocaleDateString(undefined,{day:"numeric",month:"short"});
function planAdvice(){if(!S.pl)return"Start the 8-module Foundations course and pick your pace: 1 month or 2 months.";const n=wkDone(),late=F.M.findIndex((_,i)=>!S.wk[i]&&Date.now()>due(i));
 if(n==8)return S.fin?"You finished the Foundations course. Claim your free certificate!":"All 8 modules passed. Take the final exam to earn your certificate.";
 return late>=0?`You are behind schedule on module ${late+1}. Study 30 minutes today and retake its exam.`:`On track! Next: module ${n+1}, ${F.M[n][0]}, due ${dd(n)}.`}
function begin(p){S.pl={start:Date.now(),pace:p};save();go("plan")}
function qs(a,pre){return a.map((q,i)=>`<div class="box"><b>${q[0]}</b>${q[1].map((o,j)=>`<label><input type="radio" name="${pre}${i}" value="${j}"> ${esc(o)}</label>`).join("")}<small id="${pre}e${i}"></small></div>`).join("")}
function mark(a,pre){let s=0;a.forEach((q,i)=>{const x=document.querySelector(`input[name=${pre}${i}]:checked`),ok=x&&+x.value==q[2];if(ok)s++;$(`#${pre}e${i}`).innerHTML=`<span class="${ok?"ok":"no"}">${ok?"Correct":"Wrong"}</span>: ${q[3]}`});return s}
function plan(){const open=i=>S.pl&&(i==0||S.wk[i-1]);return `<p><button class="alt" onclick="go('home')">&larr; Home</button></p><h1>${F.t}</h1><p>${F.d}</p>${guides("plan")}
${S.pl?"":`<div class="box"><b>Choose your pace</b><p>Pass each module exam to unlock the next module.</p><button onclick="begin(4)">1 month: a module every 4 days</button><button onclick="begin(7)">2 months: a module every 7 days</button></div>`}
${F.M.map((m,i)=>`<div class="box ${open(i)?"":"lock"}"><b>${open(i)?"":"&#128274; "}Module ${i+1}: ${m[0]}</b> ${S.wk[i]?"&#9989;":""}${S.pl?` <small>due ${dd(i)}${!S.wk[i]&&Date.now()>due(i)?" · behind schedule":""}</small>`:""}<br>${open(i)?`<button onclick="go('week',${i})">${S.wk[i]?"Review":"Open module"}</button>`:""}</div>`).join("")}
<div class="box ${wkDone()==8?"":"lock"}"><b>Final exam</b> ${S.fin?"&#9989;":""}<br><small>16 questions · pass with 70%</small><br>${wkDone()==8?`<button onclick="go('fin')">Take the final exam</button>`:""}${S.fin?`<button style="background:var(--g)" onclick="go('fcert')">Get free certificate</button>`:""}</div>`}
function week(k){const m=F.M[k];return `<p><button class="alt" onclick="go('plan')">&larr; Plan</button></p><h2>Module ${k+1}: ${m[0]}</h2><p class="ok"><b>${m[1]}</b></p><p>${m[2]}</p><pre>${esc(m[3])}</pre><a class="btn alt" href="${m[4][1]}" target="_blank" rel="noopener">${m[4][0]}</a><h3>Module exam</h3>${qs(m[5],"w")}<button onclick="gradeW(${k})">Submit module exam</button><div id="res" class="box" hidden></div>`}
function gradeW(k){const s=mark(F.M[k][5],"w"),p=s>=2;if(p){S.wk[k]=1;save()}$("#res").hidden=false;$("#res").innerHTML=`<h2>${s}/3 ${p?"Passed!":"Not yet"}</h2><p>${p?T[k%3]+(k<7?" The next module is unlocked.":" The final exam is unlocked."):"Re-read the lesson and retake the exam."}</p><button onclick="go('plan')">Back to plan</button>`}
const FQ=()=>F.M.flatMap(m=>[m[5][0],m[5][2]]);
function fin(){return `<p><button class="alt" onclick="go('plan')">&larr; Plan</button></p><h2>Final exam</h2>${qs(FQ(),"f")}<button onclick="gradeF()">Submit final exam</button><div id="res" class="box" hidden></div>`}
function gradeF(){const a=FQ(),s=mark(a,"f"),p=s>=0.7*a.length;if(p){S.fin=1;S.done=Date.now();save()}$("#res").hidden=false;$("#res").innerHTML=`<h2>${s}/${a.length} ${p?"Passed! You Are Making History!":"Not yet"}</h2>`+(p?`<button onclick="go('fcert')">Get free certificate</button>`:"<p>Review the modules and retake the exam.</p>")}
function fcert(){return `<p><button class="alt" onclick="go('plan')">&larr; Back</button> <button onclick="window.print()">Print</button></p><div class="cert"><h1>Certificate of Completion</h1><p>This certifies that</p><h2 style="color:var(--r)">${S.name||"Learner"}</h2><p>has completed the 8-module course</p><h2>${F.t}</h2><p>${new Date(S.done||Date.now()).toLocaleDateString()}</p><p class="ok">Smart Learning Platform · 100% Free</p></div>`}

const BAD=[/\b(fuck|shit|bitch|asshole|idiot|stupid)\w*/i,/(غبي|حمار|كلب|اخرس|وسخ)/],bad=t=>BAD.some(r=>r.test(t));
const U_=()=>{try{return JSON.parse(localStorage.getItem("slp_users")||"{}")}catch(e){return{}}},setU=u=>{try{localStorage.setItem("slp_users",JSON.stringify(u))}catch(e){}};
async function hash(pw,salt){const k=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]);const b=await crypto.subtle.deriveBits({name:"PBKDF2",salt:Uint8Array.from(atob(salt),c=>c.charCodeAt(0)),iterations:150000,hash:"SHA-256"},k,256);return btoa(String.fromCharCode(...new Uint8Array(b)))}
function auth(){return `<section class="hero" style="text-align:center"><h1>Smart Learning Platform</h1><p>Free courses. Sign in to save your progress.</p></section>${notice?`<div class="box no">${esc(notice)}</div>`:""}
<div class="box" style="max-width:460px;margin:16px auto"><div><button class="${mode=="in"?"":"alt"}" onclick="mode='in';render()">Log in</button><button class="${mode=="up"?"":"alt"}" onclick="mode='up';render()">Create account</button></div>
${mode=="up"?`<p><input type="text" id="an" placeholder="Your name" autocomplete="name" style="width:100%"></p>`:""}<p><input type="text" id="ae" placeholder="Email" inputmode="email" autocomplete="email" style="width:100%"></p>
<p><input type="password" id="ap" placeholder="Password (8+ characters)" autocomplete="${mode=="up"?"new-password":"current-password"}" style="width:100%"></p>
<button onclick="submitAuth()">${mode=="up"?"Create account":"Log in"}</button><p id="ae2" class="no"></p><small>Accounts are saved on this device only. Passwords are hashed, never stored as text.</small></div>`}
async function submitAuth(){const e=$("#ae").value.trim().toLowerCase(),p=$("#ap").value,u=U_(),er=m=>{$("#ae2").textContent=m};
 if(!/^\S+@\S+\.\S+$/.test(e))return er("Enter a valid email.");if(p.length<8)return er("Password must be at least 8 characters.");
 if(mode=="up"){const n=$("#an").value.trim();if(!n)return er("Enter your name.");if(bad(n))return er("This name is not allowed.");if(u[e])return er("This email already has an account.");
  const salt=btoa(String.fromCharCode(...crypto.getRandomValues(new Uint8Array(16))));u[e]={name:n,salt,hash:await hash(p,salt),banned:false};setU(u);enter(e)}
 else{const a=u[e];if(!a||a.hash!==await hash(p,a.salt))return er("Wrong email or password.");if(a.banned)return er("This account was removed for breaking the community rules.");enter(e)}}
function enter(e,pl=true){ME=e;let d={};try{d=JSON.parse(localStorage.getItem("slp:"+e)||"{}")}catch(x){}S=Object.assign(DEF(),d);S.name=U_()[e].name;try{localStorage.setItem("slp_sess",e)}catch(x){}notice="";view={p:"home"};$("#aiBtn").hidden=false;render();if(pl)showPledge()}
function logout(msg){ME=null;try{localStorage.removeItem("slp_sess")}catch(e){}notice=msg||"";$("#aiBtn").hidden=$("#aiPanel").hidden=true;mode="in";go("home")}
function expel(){const u=U_();if(u[ME]){u[ME].banned=true;setU(u)}logout("You were removed from the platform: improper messages lead to direct removal.")}
function boot(){let s=null;try{s=localStorage.getItem("slp_sess")}catch(e){}const a=s&&U_()[s];if(a&&!a.banned)enter(s,false);else render()}
const bar=()=>`<div class="bar2"><span>Signed in as <b>${esc(S.name)}</b></span><span><button class="alt" onclick="go('home')">Home</button><button class="alt" onclick="logout('You have logged out.')">Log out</button></span></div>`;
function showPledge(){const p=$("#pledge");p.innerHTML=`<div class="pl"><div class="pi"><h2>Honor Board · لافتة الشرف</h2><p>Welcome, <b>${esc(S.name)}</b>. You joined a community of learners. Our pledge: respect everyone, help each other, keep every reply polite. <b>Any improper message or reply means immediate removal from the platform.</b></p><p lang="ar" dir="rtl">مرحباً بك يا <b>${esc(S.name)}</b>. نتعهد جميعاً بالاحترام والأدب ومساعدة بعضنا. <b>أي رد أو رسالة غير لائقة تؤدي إلى الطرد المباشر من المنصة.</b></p><button onclick="$('#pledge').hidden=true">I agree and continue · أوافق</button></div></div>`;p.hidden=false}
const GP=[["Write Your Future","Ideas, words and big thinking",[0,1]],["Secure & Connect","Stay safe and learn together",[2,3]],["Full Power, Real Skills","Energy and abilities that last",[4,5]],["Stay Curious","Every answer starts with a question",[6]]];
function gallery(){const p=GP[gp];return `<section class="gpage"><h2 class="gt">${p[0]}</h2><p>${p[1]} · Page ${gp+1} of ${GP.length}</p></section><div class="grid2">${p[2].map(i=>{const g=GL[i],c=g[1]=="plan"?null:C.find(x=>x.id==g[1]);return `<figure class="pic3" tabindex="0" onclick="${gOpen(g)}" onkeydown="if(event.key=='Enter')${gOpen(g)}" style="cursor:pointer"><img src="${IMG[g[0]]}" alt="${c?c.t:F.t}"><figcaption><b>${c?c.t:F.t}</b><br><small>${c?c.tag+" · Free":"8 modules · 1 or 2 months · Free"}</small></figcaption></figure>`}).join("")}</div>
<div class="pager"><button class="alt" ${gp?"":"disabled"} onclick="gp--;render()">&larr; Previous</button>${GP.map((_,i)=>`<button class="dotb ${i==gp?"on":""}" aria-label="Page ${i+1}" onclick="gp=${i};render()"></button>`).join("")}<button class="alt" ${gp<GP.length-1?"":"disabled"} onclick="gp++;render()">Next &rarr;</button></div>`}
function saveScan(){S.notes.push("Scan: "+lastScan);save();$("#st").innerHTML="<small>Saved to your notes.</small>"}
function aiToggle(){const p=$("#aiPanel");p.hidden=!p.hidden;if(!p.hidden){if(!S.chat.length)S.chat.push({r:"a",t:"Hi "+S.name+"! I can save notes, show your progress, open courses and answer questions. Type help."});draw()}}
function draw(){$("#aiLog").innerHTML=S.chat.slice(-14).map(m=>`<div class="m ${m.r}">${esc(m.t)}</div>`).join("");$("#aiLog").scrollTop=1e5}
function say(r,t){S.chat.push({r,t});S.chat=S.chat.slice(-30);save();draw()}
function cmd(t){const l=t.toLowerCase().trim();let m;if(l=="confirm"&&pend){pend=0;const u=U_();delete u[ME];setU(u);try{localStorage.removeItem("slp:"+ME)}catch(e){}logout("Your account and data were deleted.");return""}pend=0;
 if(t.length>60)return null;
 if(/^(help|مساعدة)/.test(l))return"I can: show progress, open <course>, show my plan, open the scanner, save note <text>, show my notes, show my data, delete my data, log out. Anything else goes to the AI.";
 if(/progress|تقدم/.test(l))return`Modules passed: ${wkDone()}/8. Lessons passed: ${Object.keys(S.lessons).length}. Final exam: ${S.fin?"passed":"not yet"}. ${planAdvice()}`;
 if(/\bplan\b|خطة/.test(l)){go("plan");return"Opening your study plan."}
 if(/scan|ماسح/.test(l)){go("scanner");return"Opening the scanner."}
 if(m=l.match(/^(?:open|افتح)\s+(.+)/)){const q=m[1].trim(),k=C.findIndex(c=>c.t.toLowerCase().includes(q));if(/foundation/.test(q)){go("plan");return"Opening "+F.t+"."}if(k>=0){go("course",k);return"Opening "+C[k].t+"."}return"I could not find that course."}
 if(m=t.match(/^(?:save note|احفظ ملاحظة)\s*:?\s*(.+)/i)){S.notes.push(m[1]);save();return"Saved. You have "+S.notes.length+" notes."}
 if(/delete my data|احذف بياناتي/.test(l)){pend=1;return"This deletes your account and all saved data on this device. Type confirm to continue."}
 if(/my data|بياناتي/.test(l))return`Name: ${S.name}\nEmail: ${ME}\nNotes: ${S.notes.length}\nLessons passed: ${Object.keys(S.lessons).length}\nModules passed: ${wkDone()}`;
 if(/notes|ملاحظات/.test(l))return S.notes.length?S.notes.map((n,i)=>(i+1)+". "+n).join("\n"):"No notes yet. Type: save note ...";
 if(/^(log ?out|خروج)/.test(l)){logout("You have logged out.");return""}
 return null}
async function aiSend(){const i=$("#aiIn"),t=i.value.trim();if(!t)return;i.value="";if(bad(t))return expel();say("u",t);const r=cmd(t);if(r!==null){if(r)say("a",r);return}
 say("a","...");try{const sm=window.claude&&await claude.use("sample");if(!sm){S.chat.pop();say("a","The AI is not available in this view. Type help to see what I can do offline.");return}
  const ctx=JSON.stringify({name:S.name,modulesPassed:wkDone(),lessonsPassed:Object.keys(S.lessons).length,finalExam:!!S.fin,notes:S.notes.slice(-5)});
  const a=await sm([{role:"user",content:"You are the assistant of the Smart Learning Platform: free courses (Computer & Python Foundations with 8 modules, Technical Writing, Cybersecurity Basics, Git & GitHub, Computer Basics, Data Analysis, Computer Science, Python), a scanner, notes, a study plan. Answer briefly and politely in the user's language, only about learning and this platform. Learner data: "+ctx+"\n\nQuestion: "+t}],{cache:false});
  S.chat.pop();say("a",a.text)}catch(e){S.chat.pop();say("a","I could not reach the AI right now. Try a command such as help.")}}
function go(p,k){view={p,k};render();scrollTo(0,0)}
function render(){$("#app").innerHTML=ME?bar()+({home,course,exam,cert,plan,week,fin,fcert,scanner:scannerV})[view.p](view.k):auth();document.querySelectorAll('h1,h2,h3,.pic,.pic3 b,.badge,.nm,.num').forEach(touchify)}
function ans(k,i,j){const c=C[k],ok=j==c.L[i][5];if(ok){S.lessons[key(c,i)]=1;save()}
 $("#m"+i).innerHTML=ok?'<span class="ok">Correct! Keep Going!</span>':'<span class="no">Not yet. Re-read the lesson and try again.</span>';if(ok)setTimeout(()=>go("course",k),900)}
function grade(k){const c=C[k];let s=0;c.E.forEach((q,i)=>{const x=document.querySelector(`input[name=q${i}]:checked`),ok=x&&+x.value==q[2];if(ok)s++;
 $("#e"+i).innerHTML=`<span class="${ok?"ok":"no"}">${ok?"Correct":"Wrong"}</span>: ${q[3]}`});
 const p=s>=0.6*c.E.length;if(p){S.exams[c.id]=1;save()}
 $("#res").hidden=false;$("#res").innerHTML=`<h2>${s}/${c.E.length} ${p?"Passed! You Are Making History!":"Not yet"}</h2>`+(p?(done(c)==c.L.length?`<button onclick="go('cert',${k})">Get certificate</button>`:"<p>Finish all lessons to unlock your certificate.</p>"):"<p>Review the lessons and retake the exam.</p>")}
function scan(i){const f=i.files[0];if(f)$("#sc").innerHTML=`<img src="${URL.createObjectURL(f)}" alt="Scanned page"><p>Scan saved: ${f.name}</p>`}
setInterval(()=>{qi++;const h=$("#hero");if(h&&view.p=="home")h.textContent=Q[qi%3];touchify(h)},3500);
boot();
</script></body></html>
